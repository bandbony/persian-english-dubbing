name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1
      # demucs (PyTorch) isn't needed for the tests, which run with SEPARATOR=none.
      - run: grep -v '^demucs' requirements.txt > /tmp/req.txt && pip install -r /tmp/req.txt pytest
      - run: pytest -q
